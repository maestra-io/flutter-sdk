name: mindbox
description: Flutter Maestra SDK. Plugin wrapper over of Maestra iOS/Android SDK.
version: 2.16.0
homepage: https://github.com/maestra-io/flutter-sdk
repository: https://github.com/maestra-io/flutter-sdk/tree/main/mindbox
documentation: https://developers.maestra.io/docs/flutter-sdk

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: mindbox_android
      ios:
        default_package: mindbox_ios

dependencies:
  flutter:
    sdk: flutter
  mindbox_android: ^2.16.0
  mindbox_ios: ^2.16.0
  mindbox_platform_interface: ^2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

analyzer:
  exclude: ['**_test.dart'] 


